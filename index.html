<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>طريق الألف ميل</title>
<style>
/* =====================================================================
   التنسيق (CSS) — ألوان دافئة: رملي، بني، أخضر نخيل، سما زرقة، غروب
   ===================================================================== */
:root{
  --sand:#e8d3a8; --brown:#6b4423; --dark:#24170d; --palm:#4f7d3a; --sky:#7ec3e8;
  --sunset:#f08a3c; --ink:#fff6e4; --panel:rgba(38,26,16,.94); --edge:#b08a5a;
  --gold:#f2c14e; --hope:#f2a33a; --energy:#6cc76a; --red:#d9534f;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#1a120b;color:var(--ink);
  font-family:Tahoma,"Segoe UI","Noto Naskh Arabic","Geeza Pro","Arial",sans-serif;
  user-select:none;-webkit-user-select:none;touch-action:none}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated}
.hidden{display:none!important}
button{font-family:inherit}

/* ---------- الواجهة العلوية (HUD) ---------- */
#hud{position:fixed;top:0;left:0;right:0;display:flex;gap:6px;align-items:center;flex-wrap:wrap;
  padding:6px 8px;z-index:5;pointer-events:none;font-size:13px;
  background:linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,0))}
.stat{background:var(--panel);border:2px solid #7a5a36;border-radius:8px;padding:3px 8px;
  display:flex;align-items:center;gap:6px;white-space:nowrap;box-shadow:0 2px 0 #0006}
.stat b{color:var(--gold);font-weight:bold}
.bar{width:66px;height:9px;background:#0007;border-radius:5px;overflow:hidden;border:1px solid #000a}
.bar i{display:block;height:100%;transition:width .4s}
#hopeBar{background:linear-gradient(90deg,#f7d06b,var(--hope))}
#energyBar{background:linear-gradient(90deg,#9be27a,var(--energy))}
#goal{position:fixed;top:44px;right:8px;max-width:min(330px,60vw);z-index:5;pointer-events:none;
  background:rgba(38,26,16,.82);border-right:4px solid var(--gold);padding:5px 9px;border-radius:6px;font-size:12.5px;line-height:1.5}
#goal small{color:#e6c79a;display:block}
#hudBtns{position:fixed;bottom:12px;right:10px;display:flex;gap:6px;z-index:6}
.hbtn{pointer-events:auto;background:var(--panel);color:var(--ink);border:2px solid var(--edge);border-radius:10px;
  padding:7px 10px;font-size:13px;cursor:pointer;position:relative;box-shadow:0 3px 0 #0008}
.hbtn:active{transform:translateY(2px);box-shadow:0 1px 0 #0008}
.hbtn .badge{position:absolute;top:-7px;left:-7px;background:var(--red);color:#fff;border-radius:9px;font-size:11px;padding:0 5px}
#minimapWrap{position:fixed;top:44px;left:8px;z-index:5;background:#0009;border:2px solid #7a5a36;border-radius:6px;padding:2px}
#minimap{display:block;width:150px;height:110px;image-rendering:pixelated}
#locName{position:absolute;bottom:-18px;left:0;right:0;text-align:center;font-size:11px;color:#f3dfb8;text-shadow:0 1px 2px #000}
#toasts{position:fixed;top:92px;left:50%;transform:translateX(-50%);z-index:40;display:flex;flex-direction:column;gap:5px;align-items:center;pointer-events:none}
.toast{background:rgba(30,20,12,.94);border:2px solid var(--gold);border-radius:8px;padding:5px 12px;font-size:13.5px;
  animation:tin .25s ease-out;max-width:88vw;text-align:center}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}to{opacity:1}}

/* ---------- صندوق الحوار ---------- */
#dlg{position:fixed;left:50%;transform:translateX(-50%);bottom:10px;width:min(780px,96vw);z-index:30;
  background:var(--panel);border:3px solid var(--edge);border-radius:12px;padding:10px 12px;display:flex;gap:12px;
  box-shadow:0 6px 0 #0009,inset 0 0 0 2px #3b2716;min-height:118px;cursor:pointer}
#dlgPortrait{width:88px;height:88px;border:3px solid #7a5a36;border-radius:8px;background:#3a2a1a;image-rendering:pixelated;flex:none}
.dbody{flex:1;min-width:0}
#dlgName{color:var(--gold);font-weight:bold;font-size:15px;margin-bottom:4px}
#dlgText{font-size:16.5px;line-height:1.75;min-height:52px;white-space:pre-wrap}
#dlgChoices{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.choice{background:#4a3220;border:2px solid var(--edge);color:var(--ink);border-radius:8px;padding:7px 10px;text-align:right;font-size:14.5px;cursor:pointer}
.choice:hover,.choice:focus{background:#6b4a2c;outline:none}
.choice .k{color:var(--gold);margin-left:6px}
.choice[disabled]{opacity:.45;cursor:not-allowed}
#dlgNext{position:absolute;left:14px;bottom:8px;color:var(--gold);animation:bob 1s infinite}
@keyframes bob{50%{transform:translateY(3px)}}

/* ---------- النوافذ ---------- */
.overlay{position:fixed;inset:0;background:rgba(10,6,3,.62);z-index:50;display:flex;align-items:center;justify-content:center;padding:10px}
.win{background:var(--panel);border:3px solid var(--edge);border-radius:14px;max-width:min(560px,96vw);width:100%;max-height:92vh;overflow:auto;
  padding:14px 16px;box-shadow:0 8px 0 #000a;position:relative}
.win.wide{max-width:min(820px,97vw)}
.win h2{margin:0 0 8px;color:var(--gold);font-size:20px}
.win p{line-height:1.8;margin:6px 0}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;justify-content:center}
.btn{background:linear-gradient(#c8873e,#8a5424);border:2px solid #f1c27a;color:#fff;border-radius:10px;padding:9px 16px;font-size:15px;cursor:pointer;box-shadow:0 3px 0 #3b220f}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #3b220f}
.btn.sec{background:linear-gradient(#5a4632,#3a2a1a);border-color:#8a6a45}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.xclose{position:absolute;top:8px;left:10px;background:none;border:none;color:#e9cfa2;font-size:22px;cursor:pointer}
.row{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px dashed #6b4a2c}
.muted{color:#cdb48e;font-size:13px}

/* ---------- الشاشة الرئيسية ---------- */
#title{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
#titleCanvas{position:absolute;inset:0;width:100%;height:100%;z-index:-1}
#title h1{font-size:clamp(34px,8vw,68px);margin:0;color:#fff3d6;text-shadow:0 4px 0 #6b3a14,0 0 24px #f08a3c;letter-spacing:1px}
#title .sub{color:#ffe2b0;font-size:clamp(14px,3vw,18px);text-shadow:0 2px 3px #000}
#title .menu{display:flex;flex-direction:column;gap:10px;width:min(260px,80vw);margin-top:10px}
#title .menu .btn{font-size:18px;padding:11px}

/* ---------- الموبايل ---------- */
.phone{width:min(360px,94vw);max-height:90vh;background:#141414;border:10px solid #2b2b2b;border-radius:28px;padding:10px;display:flex;flex-direction:column;box-shadow:0 10px 0 #000a}
.phone .scr{background:linear-gradient(#20344a,#16222f);border-radius:14px;flex:1;overflow:auto;padding:10px;min-height:360px}
.phone .tabs{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
.phone .tab{flex:1;background:#2c3e50;border:none;color:#dfe8f0;border-radius:8px;padding:7px 2px;font-size:12px;cursor:pointer}
.phone .tab.on{background:#3d7ab8;color:#fff}
.msg{background:#ffffff14;border-radius:10px;padding:8px;margin-bottom:7px;font-size:13.5px;line-height:1.6}
.msg .from{color:#8fd0ff;font-weight:bold}
.msg.new{border-right:3px solid #5fd35f}
.pbar{height:7px;background:#0006;border-radius:4px;overflow:hidden;margin-top:4px}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,#e57373,#f2c14e,#6cc76a)}

/* ---------- الألعاب المصغرة ---------- */
.mgcanvas{display:block;margin:8px auto;background:#2a1c10;border:2px solid #7a5a36;border-radius:8px;max-width:100%;touch-action:none}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.opt{background:#4a3220;border:2px solid var(--edge);color:var(--ink);border-radius:10px;padding:12px 6px;font-size:16px;cursor:pointer}
.opt:active{background:#6b4a2c}
.timer{height:10px;background:#0006;border-radius:5px;overflow:hidden;margin:6px 0}
.timer i{display:block;height:100%;background:var(--gold)}
.ans{display:block;width:100%;text-align:right;margin:6px 0;background:#4a3220;border:2px solid var(--edge);color:var(--ink);border-radius:10px;padding:10px;font-size:14.5px;line-height:1.6;cursor:pointer}
.ans:hover{background:#6b4a2c}

/* ---------- التحكم باللمس ---------- */
#touch{position:fixed;inset:auto 0 0 0;height:0;z-index:7}
#joy{position:fixed;left:18px;bottom:70px;width:124px;height:124px;border-radius:50%;background:rgba(255,240,210,.14);border:3px solid rgba(255,230,190,.35);touch-action:none}
#knob{position:absolute;left:37px;top:37px;width:50px;height:50px;border-radius:50%;background:rgba(255,220,160,.55);border:2px solid #fff8}
#btnAct{position:fixed;right:22px;bottom:84px;width:84px;height:84px;border-radius:50%;background:rgba(240,138,60,.75);border:3px solid #ffd9a8;color:#fff;font-size:17px;font-weight:bold;touch-action:none}
#fader{position:fixed;inset:0;background:#000;z-index:80;opacity:0;pointer-events:none;transition:opacity .6s;display:flex;align-items:center;justify-content:center;font-size:24px;color:#ffe2b0;text-align:center;padding:20px;line-height:1.8}
#fader.on{opacity:1;pointer-events:auto}
#callScreen{position:fixed;inset:0;z-index:55;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.55)}
.callbox{background:linear-gradient(#1f3b57,#0e1c2a);border:8px solid #2b2b2b;border-radius:26px;padding:24px 20px;width:min(300px,90vw);text-align:center;box-shadow:0 10px 0 #000a}
.callbox .nm{font-size:22px;color:#fff;margin:10px 0}
.ringing{animation:ring .5s infinite}
@keyframes ring{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
.chapter{font-size:clamp(20px,5vw,34px)}
.chapter small{display:block;font-size:.6em;color:#e0b47a}
@media (max-width:640px){
  #hud{font-size:11px;gap:4px;padding:4px}
  .bar{width:44px}
  #minimap{width:110px;height:80px}
  #goal{top:auto;bottom:210px;right:6px;font-size:11px;max-width:52vw}
  #dlgText{font-size:15px}
  #dlgPortrait{width:64px;height:64px}
  #hudBtns{bottom:auto;top:130px;right:6px;flex-direction:column}
}
</style>
</head>
<body>
<canvas id="game"></canvas>

<!-- الواجهة -->
<div id="hud" class="hidden">
  <div class="stat">💰 <b id="hMoney">0</b></div>
  <div class="stat">الأمل <div class="bar"><i id="hopeBar"></i></div><span id="hHope"></span></div>
  <div class="stat">الطاقة <div class="bar"><i id="energyBar"></i></div><span id="hEnergy"></span></div>
  <div class="stat">اليوم <b id="hDay"></b></div>
  <div class="stat"><span id="hSun">☀</span> <b id="hTime"></b></div>
  <div class="stat" id="hChapter"></div>
</div>
<div id="goal" class="hidden"></div>
<div id="minimapWrap" class="hidden"><canvas id="minimap" width="150" height="110"></canvas><div id="locName"></div></div>
<div id="hudBtns" class="hidden">
  <button class="hbtn" id="bMap">خريطة (M)</button>
  <button class="hbtn" id="bPhone">موبايل (P)<span class="badge hidden" id="phoneBadge">0</span></button>
  <button class="hbtn" id="bSound">🔊</button>
</div>
<div id="toasts"></div>

<!-- صندوق الحوار -->
<div id="dlg" class="hidden">
  <canvas id="dlgPortrait" width="80" height="80"></canvas>
  <div class="dbody"><div id="dlgName"></div><div id="dlgText"></div><div id="dlgChoices"></div></div>
  <div id="dlgNext">▼</div>
</div>

<!-- لمس -->
<div id="touch" class="hidden"><div id="joy"><div id="knob"></div></div><button id="btnAct">تفاعل</button></div>

<!-- الشاشة الرئيسية -->
<div id="title">
  <canvas id="titleCanvas"></canvas>
  <h1>طريق الألف ميل</h1>
  <div class="sub">حكاية مصطفى… خريج من الموصل يدوّر على خطوته الأولى</div>
  <div class="menu">
    <button class="btn" id="tStart">ابدأ</button>
    <button class="btn sec" id="tCont">كمّل</button>
    <button class="btn sec" id="tHow">كيف ألعب</button>
  </div>
</div>
<div id="fader"></div>

<script>
"use strict";
/* =====================================================================
   ١) الأدوات العامة
   ===================================================================== */
const $ = s => document.querySelector(s);
const rnd = (a, b) => a + Math.random() * (b - a);
const rint = (a, b) => Math.floor(rnd(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const fmt = n => Math.round(n).toLocaleString('en-US') + ' د.ع';
const fmtT = m => { m = Math.floor(m) % 1440; return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); };
const wait = ms => new Promise(r => setTimeout(r, ms));
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
// مولّد عشوائي ثابت (حتى رسم الخرائط يطلع نفسه كل مرة)
let _seed = 1;
function srand() { _seed = (_seed * 16807) % 2147483647; return _seed / 2147483647; }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

/* =====================================================================
   ٢) الأصوات (Web Audio API) — كلها مولّدة بالكود
   ===================================================================== */
const AU = {
  ctx: null, master: null, music: null, muted: false, musicTimer: null, noteIdx: 7,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      this.master = this.ctx.createGain(); this.master.gain.value = 0.5; this.master.connect(this.ctx.destination);
      this.music = this.ctx.createGain(); this.music.gain.value = 0.35; this.music.connect(this.master);
      this.startMusic();
    } catch (e) { this.ctx = null; }
  },
  tone(f, d, type = 'sine', vol = 0.15, when = 0, slide = 0, dest) {
    if (!this.ctx || this.muted) return;
    const t = this.ctx.currentTime + when, o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.linearRampToValueAtTime(f + slide, t + d);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(dest || this.master); o.start(t); o.stop(t + d + 0.05);
  },
  noise(d, vol = 0.05, freq = 900) {
    if (!this.ctx || this.muted) return;
    const n = Math.floor(this.ctx.sampleRate * d), b = this.ctx.createBuffer(1, n, this.ctx.sampleRate), data = b.getChannelData(0);
    for (let i = 0; i < n; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const s = this.ctx.createBufferSource(), f = this.ctx.createBiquadFilter(), g = this.ctx.createGain();
    f.type = 'lowpass'; f.frequency.value = freq; g.gain.value = vol;
    s.buffer = b; s.connect(f); f.connect(g); g.connect(this.master); s.start();
  },
  step() { this.noise(0.045, 0.035, 700); },
  click() { this.tone(660, 0.05, 'square', 0.04); },
  type() { this.tone(520 + Math.random() * 120, 0.025, 'square', 0.015); },
  notify() { this.tone(880, 0.12, 'sine', 0.18); this.tone(1320, 0.18, 'sine', 0.16, 0.12); },
  success() { [523, 659, 784, 1046].forEach((f, i) => this.tone(f, 0.22, 'triangle', 0.16, i * 0.09)); },
  fail() { [392, 330, 262].forEach((f, i) => this.tone(f, 0.28, 'sawtooth', 0.06, i * 0.14)); },
  coin() { this.tone(988, 0.08, 'square', 0.06); this.tone(1319, 0.2, 'square', 0.06, 0.08); },
  honk() { this.tone(330, 0.25, 'square', 0.05); this.tone(415, 0.25, 'square', 0.04); },
  ring() { for (let i = 0; i < 6; i++) this.tone(i % 2 ? 1180 : 980, 0.09, 'sine', 0.13, i * 0.1); },
  door() { this.noise(0.12, 0.08, 400); this.tone(180, 0.1, 'sine', 0.08); },
  // موسيقى هادئة بمقام الحجاز: عود بسيط + قرار واطي
  startMusic() {
    const scale = [146.8, 155.6, 185, 196, 220, 233.1, 261.6, 293.7, 311.1, 370, 392, 440];
    let beat = 0;
    this.musicTimer = setInterval(() => {
      if (!this.ctx || this.muted || document.hidden) return;
      beat++;
      if (beat % 8 === 1) this.tone(73.4, 3.2, 'sine', 0.07, 0, 0, this.music);
      if (Math.random() < 0.72) {
        this.noteIdx = clamp(this.noteIdx + pick([-2, -1, -1, 1, 1, 2, 0]), 0, scale.length - 1);
        const f = scale[this.noteIdx];
        this.tone(f, 0.9, 'triangle', 0.05, 0, 0, this.music);
        this.tone(f * 2, 0.35, 'sine', 0.018, 0, 0, this.music);
      }
    }, 430);
  },
  toggle() { this.muted = !this.muted; if (this.master) this.master.gain.value = this.muted ? 0 : 0.5; return this.muted; }
};

/* =====================================================================
   ٣) حالة اللعبة + الحفظ التلقائي
   ===================================================================== */
const SAVE_KEY = 'tareeq_alf_meel_v1';
function newState() {
  return {
    day: 1, time: 7 * 60, money: 150000, hope: 70, energy: 100, rep: 50, chapter: 1,
    cv: { exp: 0, skills: 0, courses: [], kurdish: 0 },
    rel: { haidar: 50, abuahmed: 25, umali: 55, rebwar: 0, salem: 0, kadhim: 0 },
    shifts: { workshop: 0, waiter: 0, flyers: 0, port: 0 },
    flags: {}, today: {}, phone: true, credit: 5000,
    map: 'home', px: 0, py: 0, dir: 'down', ret: null,
    msgs: [], contacts: ['mom', 'haidar'], visited: ['mosul'], met: ['mom', 'nour'],
    spent: 0, earned: 0, inv: ['note'], dayLog: [], dayStart: { money: 150000, hope: 70 },
    debt: 0, ending: null
  };
}
let S = null;
function save() { if (!S || S.ending) return; try { S.px = G.p.x; S.py = G.p.y; S.dir = G.p.dir; localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) { } }
function loadSave() { try { const t = localStorage.getItem(SAVE_KEY); return t ? JSON.parse(t) : null; } catch (e) { return null; } }
function clearSave() { try { localStorage.removeItem(SAVE_KEY); } catch (e) { } }

/* =====================================================================
   ٤) الشخصيات: الأشكال والألوان (تُستخدم للرسم بالعالم وبصورة الوجه)
   ===================================================================== */
const CH = {
  mustafa: { name: 'مصطفى', skin: '#d9a878', hair: '#2a1a10', style: 'short', shirt: '#3a6ea5', pants: '#3b3b4a', beard: 'stubble', bg: '#5b8bb0' },
  mom: { name: 'أم مصطفى', skin: '#d8a47a', hijab: '#1c1c1c', shirt: '#1c1c1c', abaya: true, old: true, bg: '#8a6a4a' },
  nour: { name: 'نور', skin: '#e2b48a', hair: '#3a2415', style: 'pony', shirt: '#e76f8a', pants: '#6a4c93', kid: true, bg: '#f2b8c6' },
  haidar: { name: 'حيدر', skin: '#c89468', hair: '#161010', style: 'curly', shirt: '#e2a33a', pants: '#2d3a4a', beard: 'mustache', bg: '#c9884a' },
  umali: { name: 'الحجية أم علي', skin: '#c99a70', hijab: '#4a2f5c', shirt: '#2e1f3a', abaya: true, old: true, bg: '#7a5a8a' },
  abuahmed: { name: 'أبو أحمد', skin: '#c48c60', hair: '#666', style: 'bald', shirt: '#f2f2f2', pants: '#444', beard: 'full', beardColor: '#7a7a7a', apron: '#b33', bg: '#b0583a' },
  abufiras: { name: 'أبو فراس', skin: '#d0a07a', hair: '#0e0e0e', style: 'slick', shirt: '#1f1f28', pants: '#111', beard: 'mustache', glasses: 'dark', bg: '#3a3a4a' },

/* ---------- رسم صورة الوجه (Portrait) على شبكة 20×20 ---------- */
function drawPortrait(cv, key) {

  p(5, top + 9, 1, 1, L.bg || '#3a2a1a'); p(14, top + 9, 1, 1, L.bg || '#3a2a1a');

  const brow = L.hair && L.style !== 'bald' ? L.hair : (L.beardColor || '#3a2a1a');

  p(8, ey + 4, 4, 1, '#8a3a2a'); // الحلگ

    else if (L.style === 'curly') { p(4, top - 2, 12, 4, h); p(3, top, 2, 4, h); p(15, top, 2, 4, h); p(5, top - 3, 2, 1, h); p(9, top - 3, 2, 1, h); p(13, top - 3, 2, 1, h); }
    else if (L.style === 'slick') { p(5, top - 1, 10, 3, h); p(4, top, 1, 3, h); p(15, top, 1, 3, h); p(7, top - 1, 4, 1, shade(h, 40)); }
    else if (L.style === 'bald') { p(4, top + 2, 2, 3, h); p(14, top + 2, 2, 3, h); p(7, top, 6, 1, shade(sk, 20)); }
    else if (L.style === 'pony') { p(5, top - 1, 10, 3, h); p(4, top, 1, 6, h); p(15, top, 1, 6, h); p(16, top + 1, 2, 5, h); p(16, top + 1, 2, 1, '#e76f8a'); }
    else if (L.style === 'long') { p(5, top - 1, 10, 3, h); p(3, top, 2, 11, h); p(15, top, 2, 11, h); }

  if (L.hijab) { const hj = L.hijab; p(4, top - 1, 12, 3, hj); p(3, top, 2, 11, hj); p(15, top, 2, 11, hj); p(4, top + 9, 12, 3, hj); p(3, 14, 14, 2, hj); p(5, top + 1, 10, 1, shade(hj, 25)); }
  if (L.shemagh) { p(3, top - 2, 14, 4, '#f2f2f2'); p(3, top, 2, 12, '#f2f2f2'); p(15, top, 2, 12, '#f2f2f2');
    for (let i = 0; i < 7; i++) { p(3 + i * 2, top - 1, 1, 1, '#c0392b'); p(3, top + 1 + i, 1, 1, '#c0392b'); p(16, top + 1 + i, 1, 1, '#c0392b'); }
    p(3, top - 2, 14, 1, '#111'); }

  if (L.cap) { p(4, top - 2, 12, 3, L.cap); p(4, top + 1, 13, 1, shade(L.cap, -20)); }
  // اللحية

  else if (L.beard === 'mustache') { p(8, ey + 3, 4, 1, L.beardColor || L.hair || '#222'); }
  else if (L.beard === 'stubble') { for (let i = 0; i < 5; i++) { p(6 + i * 2, ey + 4 + (i % 2), 1, 1, shade(sk, -45)); p(7 + i * 2, ey + 5, 1, 1, shade(sk, -45)); } }
  if (L.glasses) { const g = L.glasses === 'dark' ? '#111' : '#333'; p(6, ey - 1, 4, 3, g); p(10, ey - 1, 4, 3, g);
    if (L.glasses !== 'dark') { p(7, ey, 2, 1, '#bfe6ff'); p(11, ey, 2, 1, '#bfe6ff'); p(8, ey, 1, 1, '#1a1a1a'); p(11, ey, 1, 1, '#1a1a1a'); } }
}
function shade(hex, amt) {
  let c = hex.replace('#', ''); if (c.length === 3) c = c.split('').map(x => x + x).join('');

  return '#' + [r, g, b].map(v => clamp(v, 0, 255).toString(16).padStart(2, '0')).join('');
}

/* ---------- رسم الشخصية بالعالم (من فوق، Pixel Art) — الإحداثي هو مكان الرجلين ---------- */
function drawSprite(c, L, x, y, dir, t, moving, sitting) {
  c.save(); c.translate(Math.round(x), Math.round(y));
  if (L.kid) c.scale(0.8, 0.8);
  c.fillStyle = 'rgba(0,0,0,.28)'; c.beginPath(); c.ellipse(0, 0, 9, 3.5, 0, 0, 6.283); c.fill();
  const sw = moving ? Math.sin(t * 13) : 0, leg = Math.round(sw * 2.5);
  const bob = moving ? Math.abs(Math.sin(t * 13)) * 1.3 : Math.sin(t * 2.2) * 0.5;
  c.translate(0, sitting ? 4 : -bob);
  const R = (a, b, w, h, col) => { c.fillStyle = col; c.fillRect(a, b, w, h); };
  const side = dir === 'left' ? -1 : dir === 'right' ? 1 : 0;
  // الرجلين / العباية
  if (L.abaya) {
    R(-7, -18, 14, 17, L.shirt); R(-8, -6, 16, 5, L.shirt); R(-6, -18, 1, 16, shade(L.shirt, 18));
    if (!sitting) { R(-5 + (side ? leg : 0), -1, 4, 2, '#111'); R(1 - (side ? leg : 0), -1, 4, 2, '#111'); }
  } else if (!sitting) {
    const pc = L.pants || '#333';
    if (side) { R(-4 + leg, -9, 4, 8, pc); R(0 - leg, -9, 4, 8, shade(pc, -15)); R(-4 + leg, -2, 4, 2, '#1a1a1a'); R(0 - leg, -2, 4, 2, '#1a1a1a'); }
    else { R(-5, -9, 4, 9 - Math.max(0, leg), pc); R(1, -9, 4, 9 - Math.max(0, -leg), pc); R(-5, -1 - Math.max(0, leg), 4, 2, '#1a1a1a'); R(1, -1 - Math.max(0, -leg), 4, 2, '#1a1a1a'); }
  } else { R(-6, -8, 12, 5, L.pants || L.shirt); }
  // الجسم
  if (!L.abaya) {
    R(-7, -20, 14, 12, L.shirt); R(-7, -20, 14, 2, shade(L.shirt, 20));
    if (L.apron) R(-5, -16, 10, 8, L.apron);
    if (L.tie && dir === 'down') R(-1, -19, 2, 8, L.tie);
  }
  // الإيدين
  const arm = moving ? Math.round(sw * 2) : 0;
  if (side) { R(-2 - arm * side, -18, 4, 9, shade(L.shirt, -18)); R(-2 - arm * side, -10, 4, 3, L.skin); }
  else { R(-10, -19 + arm, 3, 9, shade(L.shirt, -15)); R(7, -19 - arm, 3, 9, shade(L.shirt, -15)); R(-10, -11 + arm, 3, 3, L.skin); R(7, -11 - arm, 3, 3, L.skin); }
  // الراس
  const hy = -31; R(-6, hy, 12, 11, L.skin);
  const hair = L.hair || '#222';
  if (L.hijab || L.shemagh) {
    const hc = L.hijab || '#f2f2f2';
    R(-7, hy - 1, 14, 13, hc); R(-8, hy + 8, 16, 5, hc);
    if (dir === 'down') { R(-4, hy + 3, 8, 7, L.skin); } else if (side) { R(side > 0 ? 0 : -5, hy + 3, 5, 6, L.skin); }
    if (L.shemagh) { R(-7, hy - 1, 14, 2, '#111'); for (let i = -6; i < 7; i += 3) R(i, hy + 2, 1, 1, '#c0392b'); }
  } else if (dir === 'up') {
    R(-6, hy - 1, 12, 10, hair);
  } else {
    if (L.style === 'bald') { R(-6, hy + 2, 2, 4, hair); R(4, hy + 2, 2, 4, hair); }
    else if (L.style === 'curly') { R(-7, hy - 2, 14, 5, hair); R(-7, hy, 2, 6, hair); R(5, hy, 2, 6, hair); }
    else if (L.style === 'long' || L.style === 'pony') { R(-6, hy - 1, 12, 4, hair); R(-7, hy, 2, 10, hair); R(5, hy, 2, 10, hair); if (L.style === 'pony') R(side < 0 ? 5 : -9, hy + 1, 3, 7, hair); }
    else { R(-6, hy - 1, 12, 4, hair); if (!side) { R(-6, hy, 2, 4, hair); R(4, hy, 2, 4, hair); } else R(side > 0 ? -6 : 3, hy, 3, 7, hair); }
  }
  if (L.helmet) R(-7, hy - 2, 14, 5, L.helmet);
  if (L.cap) { R(-7, hy - 2, 14, 4, L.cap); if (dir === 'down') R(-6, hy + 2, 12, 1, shade(L.cap, -25)); }
  // الوجه
  if (dir !== 'up') {
    const ex = side ? (side > 0 ? 1 : -3) : 0;
    if (side) R(ex, hy + 5, 2, 2, '#1a1a1a'); else { R(-3, hy + 5, 2, 2, '#1a1a1a'); R(1, hy + 5, 2, 2, '#1a1a1a'); }
    if (L.glasses) { if (side) R(ex - 1, hy + 4, 4, 3, 'rgba(20,20,20,.6)'); else R(-4, hy + 4, 8, 3, 'rgba(20,20,20,.55)'); }
    if (L.beard === 'full') R(side ? (side > 0 ? -2 : -4) : -5, hy + 7, side ? 6 : 10, 4, L.beardColor || hair);
    else if (L.beard === 'mustache') R(side ? ex - 1 : -3, hy + 8, side ? 4 : 6, 1, L.beardColor || hair);
  }
  c.restore();
}

/* =====================================================================
   ٥) الخريطة: البلاطات، البنايات، الديكور — وكل المدن والأماكن الداخلية
   ===================================================================== */
const TS = 32; // حجم البلاطة بالبكسل
const T = { SAND: 0, ROAD: 1, WALK: 2, WATER: 3, BRIDGE: 4, GRASS: 5, FLOOR: 6, WALL: 7, STONE: 8, DIRT: 9, CARPET: 10, TILEF: 11, BRIDGEW: 12, PAVE: 13, EXIT: 14 };
const MINI_COL = ['#dcc08a', '#4a4a50', '#b8ab94', '#3d84b6', '#6a6a70', '#7ea552', '#b98a55', '#3a2a1a', '#b9a07a', '#c29a64', '#8a2a2a', '#e0d6c4', '#a09482', '#d3c29e', '#f2c14e'];
const TALL = new Set(['palm', 'tree', 'lamp', 'crane', 'minaret']);
const MAPS = {};
const CITY_NAMES = { mosul: 'الموصل', baghdad: 'بغداد', erbil: 'أربيل', basra: 'البصرة', kirkuk: 'كركوك' };

function makeMap(id, name, w, h, base, outdoor, city) {
  const m = { id, name, w, h, outdoor, city, tiles: new Uint8Array(w * h).fill(base), solid: new Uint8Array(w * h),
    doors: {}, blds: [], props: [], npcs: [], lamps: [], labels: [], roadsH: [], roadsV: [], exit: null, spawn: { x: 2, y: 2 }, walkers: 0, cars: 0 };
  MAPS[id] = m; return m;
}
const tAt = (m, x, y) => (x < 0 || y < 0 || x >= m.w || y >= m.h) ? -1 : m.tiles[y * m.w + x];
function setT(m, x, y, t) { if (x >= 0 && y >= 0 && x < m.w && y < m.h) m.tiles[y * m.w + x] = t; }
function fillT(m, x, y, w, h, t) { for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) setT(m, i, j, t); }
function setWalk(m, x, y) { const t = tAt(m, x, y); if (t === T.ROAD || t === T.BRIDGE || t < 0) return; setT(m, x, y, t === T.WATER || t === T.BRIDGEW ? T.BRIDGEW : T.WALK); }
function setRoad(m, x, y) { const t = tAt(m, x, y); if (t < 0) return; setT(m, x, y, t === T.WATER || t === T.BRIDGEW ? T.BRIDGE : T.ROAD); }
function hRoad(m, y, x1, x2) { for (let x = x1; x <= x2; x++) { setWalk(m, x, y - 1); setWalk(m, x, y + 3); for (let k = 0; k < 3; k++) setRoad(m, x, y + k); } m.roadsH.push({ y, x1, x2 }); }
function vRoad(m, x, y1, y2) { for (let y = y1; y <= y2; y++) { setWalk(m, x - 1, y); setWalk(m, x + 3, y); for (let k = 0; k < 3; k++) setRoad(m, x + k, y); } m.roadsV.push({ x, y1, y2 }); }
function setSolid(m, x, y, v) { if (x >= 0 && y >= 0 && x < m.w && y < m.h) m.solid[y * m.w + x] = v; }
// بناية: الباب دائماً بالصف الأخير (الواجهة للأسفل)
function bld(m, o) {
  o.style = o.style || 'shop'; m.blds.push(o);
  for (let j = o.y; j < o.y + o.h; j++) for (let i = o.x; i < o.x + o.w; i++) setSolid(m, i, j, 1);
  if (o.door != null) {
    o.dx = o.x + o.door; o.dy = o.y + o.h - 1;
    if (o.to || o.act) { setSolid(m, o.dx, o.dy, 2); m.doors[o.dy * m.w + o.dx] = o; }
  }
  return o;
}
function prop(m, type, x, y, w = 1, h = 1, opt = {}) {
  const p = Object.assign({ type, x, y, w, h, solid: true }, opt); m.props.push(p);
  if (p.solid) { if (TALL.has(type)) setSolid(m, x, y, 1); else for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) setSolid(m, i, j, 1); }
  if (type === 'lamp') m.lamps.push({ x: x * TS + 16, y: y * TS - 30 });
  return p;
}
function npc(m, o) { o.dir = o.dir || 'down'; m.npcs.push(o); return o; }
function label(m, x, y, text, col) { m.labels.push({ x, y, text, col }); }
function room(id, name, w, h, floor, wall, city) {
  const m = makeMap(id, name, w, h, floor, false, city);
  fillT(m, 0, 0, w, 2, T.WALL); for (let y = 0; y < h; y++) { setT(m, 0, y, T.WALL); setT(m, w - 1, y, T.WALL); }
  fillT(m, 0, h - 1, w, 1, T.WALL);
  const ex = Math.floor(w / 2); setT(m, ex, h - 1, T.EXIT); m.exit = { x: ex, y: h - 1 }; m.wallColor = wall; m.spawn = { x: ex, y: h - 2 };
  return m;
}
function palms(m, list) { list.forEach(([x, y]) => prop(m, 'palm', x, y)); }
function lampsRow(m, y, x1, x2, step) { for (let x = x1; x <= x2; x += step) { const t = tAt(m, x, y); if (m.solid[(y - 2) * m.w + x] === 2 || m.solid[y * m.w + x] || t === T.ROAD || t === T.BRIDGE || t === T.WATER) continue; prop(m, 'lamp', x, y, 1, 1, { solid: t !== T.BRIDGEW }); } }

/* ---------------------- الموصل (المدينة الكاملة) ---------------------- */
function buildMosul() {
  const m = makeMap('mosul', 'الموصل', 64, 48, T.SAND, true, 'mosul');
  // المناطق المبلطة
  fillT(m, 0, 0, 33, 48, T.PAVE); fillT(m, 40, 0, 24, 48, T.PAVE);
  // نهر دجلة وضفافه
  fillT(m, 34, 0, 5, 48, T.WATER); fillT(m, 33, 0, 1, 48, T.GRASS); fillT(m, 39, 0, 1, 48, T.GRASS);
  // الشوارع

      for (let a = 0; a < 7; a++) { const ang = -Math.PI + a * (Math.PI / 6) + 0.05 * Math.sin(t + a); c.beginPath(); c.moveTo(tx, ty); c.quadraticCurveTo(tx + Math.cos(ang) * 16, ty + Math.sin(ang) * 16 - 6, tx + Math.cos(ang) * 26, ty + Math.sin(ang) * 14 + 10); c.stroke(); }
      c.strokeStyle = '#5fa03a'; c.lineWidth = 2; for (let a = 0; a < 7; a++) { const ang = -Math.PI + a * (Math.PI / 6); c.beginPath(); c.moveTo(tx, ty); c.lineTo(tx + Math.cos(ang) * 22, ty + Math.sin(ang) * 10 + 8); c.stroke(); }

    case 'tree': c.fillStyle = 'rgba(0,0,0,.2)'; c.beginPath(); c.ellipse(X + 16, Y + 28, 14, 5, 0, 0, 6.283); c.fill(); R(13, 8, 6, 22, '#7a4a22');

    case 'lamp': R(14, -26, 4, 54, '#555a60'); R(10, -32, 12, 7, '#333'); R(12, -26, 8, 3, (typeof S !== 'undefined' && S && isNight()) ? '#ffe9a0' : '#bbb'); break;

    case 'plant': R(10, 18, 12, 12, '#a0522d'); c.fillStyle = '#3f8a3a'; c.beginPath(); c.arc(X + 16, Y + 12, 10, 0, 6.283); c.fill(); c.fillStyle = '#5aaa4a'; c.beginPath(); c.arc(X + 12, Y + 8, 5, 0, 6.283); c.fill(); break;

      c.fillStyle = '#e0b04a'; c.beginPath(); c.moveTo(X + W / 2, Y + 14); c.lineTo(X + W / 2 + 18, Y + H / 2); c.lineTo(X + W / 2, Y + H - 14); c.lineTo(X + W / 2 - 18, Y + H / 2); c.fill(); break;

    case 'samovar': R(10, 0, 12, 22, '#c0a040'); R(12, -6, 8, 6, '#a08030'); R(22, 10, 5, 3, '#a08030'); break;

    case 'cart': R(0, 4, W, 18, '#c0c8cc'); R(2, 6, W - 4, 8, '#e0f0f8'); R(4, 22, 8, 8, '#333'); R(W - 12, 22, 8, 8, '#333'); R(W / 2 - 1, -18, 2, 22, '#666');
      for (let i = -22; i < 22; i += 11) R(W / 2 + i, -24, 11, 7, (i / 11) % 2 ? '#e74c3c' : '#f5f0e0'); break;
    case 'car': case 'kia': case 'bus': drawVehicle(c, X + W / 2, Y + 16, p.type, p.color || '#f5f5f5', 1); break;

}
// سيارة (من فوق). dir: 1 يمين، -1 يسار، 2 تحت، -2 فوق
function drawVehicle(c, x, y, type, color, dir) {
  c.save(); c.translate(Math.round(x), Math.round(y));
  if (Math.abs(dir) === 2) c.rotate(dir > 0 ? Math.PI / 2 : -Math.PI / 2); else if (dir < 0) c.scale(-1, 1);
  const L = type === 'bus' ? 84 : type === 'kia' ? 58 : 46, Wd = type === 'bus' ? 26 : 22;
  c.fillStyle = 'rgba(0,0,0,.3)'; c.fillRect(-L / 2 + 2, -Wd / 2 + 3, L, Wd);
  c.fillStyle = color; c.fillRect(-L / 2, -Wd / 2, L, Wd);
  c.fillStyle = shade(color, -35); c.fillRect(-L / 2, Wd / 2 - 3, L, 3);
  c.fillStyle = '#2a3a4a';
  if (type === 'bus') { for (let i = -L / 2 + 8; i < L / 2 - 12; i += 12) c.fillRect(i, -Wd / 2 + 3, 9, Wd - 6); c.fillRect(L / 2 - 10, -Wd / 2 + 3, 7, Wd - 6); }
  else if (type === 'kia') { c.fillRect(L / 2 - 14, -Wd / 2 + 2, 10, Wd - 4); c.fillRect(-L / 2 + 6, -Wd / 2 + 3, L - 24, Wd - 6); c.fillStyle = '#c0392b'; c.fillRect(-L / 2, -1, L, 3); }
  else { c.fillRect(L / 2 - 16, -Wd / 2 + 2, 9, Wd - 4); c.fillRect(-L / 2 + 5, -Wd / 2 + 3, 8, Wd - 6); c.fillStyle = shade(color, 15); c.fillRect(-L / 2 + 14, -Wd / 2 + 3, L - 31, Wd - 6); }
  c.fillStyle = '#fff6b0'; c.fillRect(L / 2 - 3, -Wd / 2 + 2, 3, 4); c.fillRect(L / 2 - 3, Wd / 2 - 6, 3, 4);
  c.fillStyle = '#c0392b'; c.fillRect(-L / 2, -Wd / 2 + 2, 2, 4); c.fillRect(-L / 2, Wd / 2 - 6, 2, 4);
  c.restore();
}

async function runScript(fn) {

/* ---------- صندوق الحوار: النص يطلع حرف حرف ---------- */
const DLG = { active: false, full: '', n: 0, timer: null, res: null, choices: null, hideT: null };
function say(who, text, choices) {
  return new Promise(res => {
    clearTimeout(DLG.hideT);
    $('#dlg').classList.remove('hidden');
    let L = CH.narrator, name = '';
    if (who) { L = typeof who === 'string' ? (CH[who] || CH.narrator) : who; name = L.name || ''; }
    if (who === 'mustafa' && text.startsWith('(')) name = 'مصطفى (بقلبه)';
    $('#dlgName').textContent = name;
    drawPortrait($('#dlgPortrait'), L);
    Object.assign(DLG, { active: true, full: text, n: 0, res, choices: choices || null });
    $('#dlgChoices').innerHTML = ''; $('#dlgNext').style.display = 'none'; $('#dlgText').textContent = '';
    clearInterval(DLG.timer);
    DLG.timer = setInterval(() => {
      DLG.n++; $('#dlgText').textContent = DLG.full.slice(0, DLG.n);
      if (DLG.n % 3 === 0) AU.type();
      if (DLG.n >= DLG.full.length) finishTyping();
    }, 22);
  });
}
function finishTyping() {
  clearInterval(DLG.timer); DLG.n = DLG.full.length; $('#dlgText').textContent = DLG.full;
  if (DLG.choices) {
    const box = $('#dlgChoices'); box.innerHTML = '';
    DLG.choices.forEach((ch, i) => {
      const o = typeof ch === 'string' ? { t: ch } : ch;
      const b = document.createElement('button'); b.className = 'choice';
      b.innerHTML = `<span class="k">${i + 1}.</span>${esc(o.t)}`;
      if (o.off) b.disabled = true;
      b.onclick = e => { e.stopPropagation(); if (!o.off) pickChoice(i); };
      box.appendChild(b);
    });
  } else $('#dlgNext').style.display = 'block';
}
function pickChoice(i) { AU.click(); endLine(i); }
function endLine(v) {
  DLG.active = false; $('#dlgChoices').innerHTML = '';
  const r = DLG.res; DLG.res = null;
  DLG.hideT = setTimeout(() => $('#dlg').classList.add('hidden'), 70);
  r && r(v);
}
function dlgAdvance() {
  if (!DLG.active) return;
  if (DLG.n < DLG.full.length) { finishTyping(); return; }
  if (DLG.choices) return;
  AU.click(); endLine();
}
const ask = (who, text, opts) => say(who, text, opts);
const narrate = t => say(null, t);

function lookOf(n) { const base = typeof n.ch === 'string' ? CH[n.ch] : n.ch; return n.name ? Object.assign({}, base, { name: n.name }) : base; }

/* ---------- الإشعارات ---------- */
function toast(t, ms = 2800) {
  const d = document.createElement('div'); d.className = 'toast'; d.textContent = t;
  const box = $('#toasts'); box.appendChild(d); setTimeout(() => d.remove(), ms);
  while (box.children.length > 4) box.firstChild.remove();
}

/* ---------- النوافذ ---------- */
function modal({ html, cls = '', closable = true, raw = false, onClose, z }) {
  G.modals++;
  const ov = document.createElement('div'); ov.className = 'overlay'; if (z) ov.style.zIndex = z;
  ov.innerHTML = raw ? html : `<div class="win ${cls}">${closable ? '<button class="xclose" title="إغلاق">✕</button>' : ''}${html}</div>`;
  document.body.appendChild(ov);
  let closed = false, _r;
  const api = {
    el: ov, done: new Promise(r => _r = r), closable,
    close(v) { if (closed) return; closed = true; ov.remove(); G.modals--; G.stack = G.stack.filter(x => x !== api); onClose && onClose(v); _r(v); updateHUD(); },
    q: s => ov.querySelector(s)
  };
  if (closable) { const x = ov.querySelector('.xclose'); if (x) x.onclick = () => api.close(); ov.addEventListener('pointerdown', e => { if (e.target === ov) api.close(); }); }
  G.stack.push(api);
  return api;
}
// نافذة اختيار بسيطة ترجع رقم الزر
function choiceModal(title, bodyHtml, buttons, closable = false) {
  const m = modal({ closable, html: `<h2>${title}</h2><div>${bodyHtml}</div><div class="btns">${buttons.map((b, i) => `<button class="btn ${b.sec ? 'sec' : ''}" data-i="${i}" ${b.off ? 'disabled' : ''}>${b.t}</button>`).join('')}</div>` });
  m.el.querySelectorAll('[data-i]').forEach(b => b.onclick = () => { AU.click(); m.close(+b.dataset.i); });
  return m.done;
}

// ١) الورشة: لحيم — دوس بالوقت الصح لما المؤشر يكون بالمنطقة الخضرة
function solderGame() {
  return new Promise(res => {
    const m = modal({ closable: false, html: `<h2>🔧 تصليح موبايلات — لحيم</h2><p class="muted">دوس "لحّم!" (أو Space) لما المؤشر يصير بالمنطقة الخضرة. ٦ موبايلات.</p>
      <canvas class="mgcanvas" width="340" height="170"></canvas><div style="text-align:center" id="sgInfo">موبايل 1 / 6</div><div class="btns"><button class="btn" id="sgBtn">لحّم!</button></div>` });
    const cv = m.q('canvas'), c = cv.getContext('2d');
    let round = 0, hits = 0, pos = 0, dirr = 1, spd = 1.1, zone = 0, zw = 0, flash = 0, flashCol = '', run = true;
    const newRound = () => { zw = 0.2 - round * 0.018; zone = 0.1 + Math.random() * (0.8 - zw); spd = 0.9 + round * 0.22; };
    newRound();
    const press = () => {
      if (!run) return;
      const ok = pos >= zone && pos <= zone + zw;
      if (ok) { hits++; AU.success(); flashCol = '#6cc76a'; } else { AU.fail(); flashCol = '#d9534f'; }
      flash = 0.4; round++;
      if (round >= 6) { run = false; setTimeout(() => { G.mgKey = null; m.close(); res(hits); }, 700); }
      else { newRound(); m.q('#sgInfo').textContent = `موبايل ${round + 1} / 6 — صلّحت ${hits}`; }
    };
    m.q('#sgBtn').onclick = press; G.mgKey = k => { if (k === ' ' || k === 'e' || k === 'Enter') press(); };
    let last = performance.now();
    const loop = now => {
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      if (run) { pos += dirr * spd * dt; if (pos > 1) { pos = 1; dirr = -1; } if (pos < 0) { pos = 0; dirr = 1; } }
      c.fillStyle = '#1f3a2a'; c.fillRect(0, 0, 340, 170);
      c.fillStyle = '#2d5a3a'; c.fillRect(70, 12, 200, 100); // لوحة الموبايل
      c.strokeStyle = '#c9a44a'; c.lineWidth = 2; for (let i = 0; i < 6; i++) { c.beginPath(); c.moveTo(80, 25 + i * 14); c.lineTo(260, 25 + i * 14 + (i % 2 ? 6 : -4)); c.stroke(); }
      c.fillStyle = '#111'; c.fillRect(140, 40, 50, 40); c.fillStyle = '#888'; c.fillRect(200, 30, 20, 14); c.fillRect(100, 70, 16, 24);
      c.fillStyle = '#f2c14e'; c.beginPath(); c.arc(165, 60, 4 + (flash > 0 ? 6 : 0), 0, 6.283); c.fill();
      c.fillStyle = '#0006'; c.fillRect(20, 130, 300, 22);
      c.fillStyle = '#4caf50'; c.fillRect(20 + zone * 300, 130, zw * 300, 22);
      c.fillStyle = '#fff'; c.fillRect(20 + pos * 300 - 2, 124, 4, 34);
      if (flash > 0) { flash -= dt; c.fillStyle = flashCol; c.globalAlpha = flash; c.fillRect(0, 0, 340, 170); c.globalAlpha = 1; }
      if (document.body.contains(cv)) requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  });
}
// ٢) نادل: اختار الطلب الصح قبل ما يخلص الوقت
function waiterGame() {
  return new Promise(res => {
    const ITEMS_W = ['استكان چاي', 'كباب', 'تكة', 'ماي', 'لبن', 'تمن ومرق', 'بقلاوة', 'كولا'];
    const m = modal({ closable: false, html: `<h2>🍽 نادل بمطعم أبو أحمد</h2><p class="muted">الزبون يطلب، وإنت تختار الصينية الصح بسرعة. ٨ طلبات.</p>
      <div class="msg" style="font-size:18px;text-align:center" id="wOrder"></div><div class="timer"><i id="wT"></i></div><div class="opts" id="wOpts"></div><div id="wInfo" class="muted" style="text-align:center;margin-top:6px"></div>` });
    let n = 0, ok = 0, t = 0, timer = null, cur = null, lock = false;
    const next = () => {
      if (n >= 8) { clearInterval(timer); G.mgKey = null; setTimeout(() => { m.close(); res(ok); }, 500); return; }
      lock = false; cur = pick(ITEMS_W); const table = rint(1, 6);
      m.q('#wOrder').innerHTML = `طاولة ${table}: <b>"${pick(['عيني جيبلي', 'بلا زحمة', 'الله يخليك', 'خيّو'])} ${cur}"</b>`;
      const opts = shuffle([cur, ...shuffle(ITEMS_W.filter(x => x !== cur)).slice(0, 3)]);
      m.q('#wOpts').innerHTML = opts.map((o, i) => `<button class="opt" data-o="${o}">${i + 1}. ${o}</button>`).join('');
      m.el.querySelectorAll('[data-o]').forEach(b => b.onclick = () => choose(b.dataset.o, b));
      G.mgKey = k => { const i = +k - 1; const bs = m.el.querySelectorAll('[data-o]'); if (bs[i]) choose(bs[i].dataset.o, bs[i]); };
      t = 0; n++; m.q('#wInfo').textContent = `طلب ${n} / 8 — صح: ${ok}`;
    };
    const choose = (o, b) => {
      if (lock) return; lock = true;
      if (o === cur) { ok++; AU.coin(); b.style.background = '#2e7d32'; } else { AU.fail(); b.style.background = '#8a2a2a'; }
      setTimeout(next, 350);
    };
    timer = setInterval(() => { if (lock) return; t += 0.05; const lim = Math.max(2.2, 4 - n * 0.2); m.q('#wT').style.width = Math.max(0, 100 - t / lim * 100) + '%'; if (t >= lim) { lock = true; AU.fail(); setTimeout(next, 300); } }, 50);
    next();
  });
}
// ٣) توزيع/تحميل: دوس على الناس (أو الصناديق) قبل ما يختفون
function tapGame(title, kind) {
  return new Promise(res => {
    const m = modal({ closable: false, html: `<h2>${title}</h2><p class="muted">${kind === 'box' ? 'دوس على الصناديق حتى تشيلها قبل ما يصيح عليك رئيس العمال!' : 'دوس على الناس اللي يطلعون من الشبابيك والأبواب حتى تنطيهم إعلان.'} (٢٠ ثانية)</p>
      <canvas class="mgcanvas" width="300" height="300"></canvas><div id="tgInfo" style="text-align:center"></div>` });
    const cv = m.q('canvas'), c = cv.getContext('2d');
    let hits = 0, miss = 0, time = 20, cells = Array(9).fill(0).map(() => ({ on: 0, look: pick(WALKER_LOOKS) })), spawnT = 0, run = true;
    const hit = (x, y) => {
      if (!run) return;
      const i = Math.floor(y / 100) * 3 + Math.floor(x / 100);
      if (cells[i] && cells[i].on > 0) { cells[i].on = -0.25; hits++; AU.coin(); } else { miss++; AU.click(); }
    };
    cv.onpointerdown = e => { const r = cv.getBoundingClientRect(); hit((e.clientX - r.left) * 300 / r.width, (e.clientY - r.top) * 300 / r.height); };
    G.mgKey = k => { const i = +k - 1; if (i >= 0 && i < 9) hit((i % 3) * 100 + 50, Math.floor(i / 3) * 100 + 50); };
    let last = performance.now();
    const loop = now => {
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      if (run) {
        time -= dt; spawnT -= dt;
        if (spawnT <= 0) { const free = cells.map((c, i) => c.on === 0 ? i : -1).filter(i => i >= 0); if (free.length) { const cc = cells[pick(free)]; cc.on = 1.1 - Math.min(0.5, (20 - time) * 0.02); cc.look = pick(WALKER_LOOKS); } spawnT = rnd(0.35, 0.7); }
        cells.forEach(cc => { if (cc.on > 0) { cc.on -= dt; if (cc.on <= 0) cc.on = 0; } else if (cc.on < 0) { cc.on += dt; if (cc.on >= 0) cc.on = 0; } });
        if (time <= 0) { run = false; G.mgKey = null; setTimeout(() => { m.close(); res(hits); }, 600); }
      }
      c.fillStyle = kind === 'box' ? '#c29a64' : '#d8c7a3'; c.fillRect(0, 0, 300, 300);
      cells.forEach((cc, i) => {
        const x = (i % 3) * 100, y = Math.floor(i / 3) * 100;
        if (kind === 'box') { c.fillStyle = '#9a7a4a'; c.fillRect(x + 8, y + 70, 84, 22); }
        else { c.fillStyle = '#8a6a45'; c.fillRect(x + 14, y + 10, 72, 84); c.fillStyle = '#3a2414'; c.fillRect(x + 20, y + 16, 60, 78); }
        if (cc.on > 0) {
          if (kind === 'box') { c.save(); c.translate(x + 18, y + 22); c.scale(2, 2); drawProp(c, { type: 'crate', x: 0, y: 0, w: 1, h: 1 }, 0); c.restore(); }
          else { c.save(); c.translate(x + 50, y + 92); c.scale(2.2, 2.2); drawSprite(c, cc.look, 0, 0, 'down', 0, false); c.restore(); }
        } else if (cc.on < 0) { c.fillStyle = '#6cc76a'; c.font = 'bold 30px Tahoma'; c.textAlign = 'center'; c.fillText('✓', x + 50, y + 60); }
      });
      m.q('#tgInfo').textContent = `الوقت: ${Math.max(0, Math.ceil(time))} — ${kind === 'box' ? 'صناديق' : 'إعلانات'}: ${hits}`;
      if (document.body.contains(cv)) requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  });
}

async function doJob(key) {
  const J = JOBS[key];
  if (S.energy < J.energy) { await say('mustafa', '(تعبان هواية... لازم آكل أو أنام أول.)'); return -1; }
  if (lateFor(J.hours * 60)) { await say('mustafa', '(الوقت متأخر... ما يلحگ الشفت يخلص.)'); return -1; }
  if (!once('job_' + key)) { await narrate('خلصت شفت اليوم هنا. تعال باچر.'); return -1; }
  const score = await J.game();
  passTime(J.hours * 60); addEnergy(-J.energy);
  const pay_ = J.base + J.per * score;
  addMoney(pay_, J.name); S.shifts[key]++; S.cv.exp++;
  const good = score >= J.max * 0.6;
  addHope(good ? 3 : 1, good ? 'شغل زين' : 'على الأقل اشتغلت');
  logDay(`${J.name}: ${score}/${J.max} وأخذ ${fmt(pay_)}`);
  save();
  return score;
}

    const answers = shuffle([{ t: q[1], s: 2, r: pick(['زين، عجبني جوابك.', 'صراحتك تحسبلك.', 'همم، جواب ناضج.']) }, { t: q[2], s: 0, r: pick(['همم... ثقة زايدة شوية.', 'إحنا نريد واقعية، مو كلام كبير.', '(يرفع حاجبه)']) }, { t: q[3], s: 1, r: pick(['ممكن توضح أكثر؟ لا تستحي.', 'لا تخاف، احچي براحتك.', 'زين... بس لازم تكون أوضح.']) }]);
    const box = m.q('#ivA'); box.innerHTML = answers.map((a, j) => `<button class="ans" data-j="${j}">${j + 1}. ${esc(a.t)}</button>`).join('');
    const j = await new Promise(r => { box.querySelectorAll('[data-j]').forEach(b => b.onclick = () => r(+b.dataset.j)); G.mgKey = k => { const x = +k - 1; if (x >= 0 && x < 3) r(x); }; });
    G.mgKey = null; AU.click();
    score += answers[j].s; box.innerHTML = ''; m.q('#ivR').textContent = answers[j].r;
    await wait(1200);
  }
  let bonus = cvScore();
  if (kind === 'erbil' && S.rel.rebwar >= 60) bonus += 1;
  if (kind === 'baghdad' && S.flags.salemAdvice) bonus += 0.5;
  const total = score + bonus, pass = total >= I.pass;
  m.q('#ivN').textContent = 'النتيجة';
  m.q('#ivQ').innerHTML = `الأجوبة: <b>${score}/10</b> — قوة الـCV: <b>+${bonus.toFixed(1)}</b><br>المجموع: <b>${total.toFixed(1)}</b> (المطلوب ${I.pass})`;
  m.q('#ivR').innerHTML = pass ? '<b style="color:#8f8">✔ نجحت بالمقابلة!</b>' : '<b style="color:#f88">✘ ما نجحت هالمرة...</b><br><span class="muted">جرب تكون صادق أكثر، وقوّي سيرتك بالشغل والدورات والكتب.</span>';
  m.q('#ivA').innerHTML = '<div class="btns"><button class="btn">تمام</button></div>';
  pass ? AU.success() : AU.fail();
  await new Promise(r => m.q('#ivA .btn').onclick = r);
  m.close();
  passTime(120); addEnergy(-10);
  return { pass, total };
}

  const c = await ask('mustafa', '(هاي... هاي ممكن تكون بداية شي أكبر. مشروعي الخاص.)', ['أقبل! وأسويلك أحسن منيو بالموصل', 'خليني أفكر عمي']);

}

/* ---------- ورشة أبو يونس ---------- */
TALK.abuyounis = async n => {
  meet('abuyounis', false);
  if (!S.flags.workshopTip && !S.flags.workshopJob) {
    await say('abuyounis', 'أهلاً... تريد تصلّح موبايل؟');
    await say('mustafa', 'لا عمي، أدوّر شغل.');
    await say('abuyounis', 'والله يا ابني آني ما أشغّل واحد ما أعرفه. الشغل هنا أمانة، موبايلات الناس بيها أسرارهم. منو يعرفك؟');
    await say('mustafa', '(لازم أحد يعرّفني عليه... يمكن الحجية أم علي تعرفه؟)');
    return;
  }
  if (!S.flags.workshopDecided) {
    await say('abuyounis', 'أم علي دزّتك؟ هاي الحجية على راسي. إنت ابن يوسف النجار؟ الله يرحمه، جانت إيده تتلف بحرير.');
    await say('abuyounis', 'اسمع: أحتاج واحد يساعدني. لحيم، تبديل شاشات، تنظيف... 8 آلاف باليوم وفوگاها حسب شغلك. الدوام من 9 للـ 6.');
    await say('abuyounis', 'أدري إنت خريج وتريد شغل بمجالك. بس هنا تتعلم، وتكتب بالـCV خبرة. ها، شتگول؟');
    const c = await ask('mustafa', '(شغل مؤقت، فلوس قليلة... بس خبرة. لو أرفض وأكمل أدوّر بمجالي؟)', ['أقبل — الشغل مو عيب، والخبرة تنفع', 'لا عمي، أريد أكمل أدوّر بمجالي']);
    S.flags.workshopDecided = true;
    if (c === 0) { S.flags.workshopJob = true; addHope(5, 'لگى شغل مؤقت'); await say('abuyounis', 'عفية! تعال أي يوم بين 9 و6 وابدي الشفت. خطوة خطوة.'); logDay('قبل شغل الورشة المؤقت'); }
    else { S.flags.workshopRefused = true; await say('abuyounis', 'براحتك يابا. إذا غيرت رأيك الباب مفتوح.'); logDay('رفض شغل الورشة وكمل يدوّر بمجاله'); }
    return;
  }
  if (S.flags.workshopRefused) {
    const c = await ask('abuyounis', 'ها ابني؟ غيرت رأيك؟', ['إي عمي، أريد أشتغل', 'لا، بس جيت أسلّم']);
    if (c === 0) { S.flags.workshopRefused = false; S.flags.workshopJob = true; await say('abuyounis', 'أهلاً بيك. يلا ابدي الشفت متى ما تريد.'); }
    return;
  }
  const c = await ask('abuyounis', pick(['هلا بمصطفى! جاهز للشغل؟', 'عدنا اليوم ست موبايلات خربانة، يلا!', 'الشاشات ما تتبدل وحدها ابني ههه.']), ['ابدي شفت (5 ساعات)', 'لا، بعدين']);
  if (c === 0) { const s = await doJob('workshop'); if (s >= 0) await say('abuyounis', s >= 4 ? 'ما شاء الله! إيدك خفيفة مثل أبوك.' : 'مو مشكلة، اللحيم يرادله صبر. باچر أحسن.'); }
};

/* ---------- بغداد: أستاذ سالم وشركة الرافدين ---------- */
const SALEM_WISDOM = ['المتنبي نفسه، اللي هالشارع باسمه، گال: على قدر أهل العزم تأتي العزائم.', 'الجاحظ گال: الكتاب نعم الجليس. وآني أگول: والصبر نعم الرفيق.', 'بالكتب يگولون: قطرة الماي تثقب الصخر، مو بقوتها، بتكرارها.', 'ابن خلدون گال: الإنسان ابن عوائده. خلّي عادتك التعلم، مو الانتظار.', 'من طلب العلا سهر الليالي... بس نام زين هم يا ابني، السهر وحده ما يصنع شي.', 'هالشارع احترق وانفجر ورجع انبنى. الكتب علمتنا إن الرماد مو نهاية.'];
TALK.salem = async n => {
  meet('salem');
  if (!S.flags.metSalem) {
    S.flags.metSalem = true;
    await say('salem', 'تفضل يا ابني، تفضل. المكتبة مفتوحة للي يقرا وللي يدوّر.');
    await say('mustafa', 'السلام عليكم أستاذ. آني مصطفى من الموصل. جيت لبغداد أدوّر شغل... خريج حاسبات.');
    await say('salem', 'من الموصل؟ أم الربيعين! ... اسمع يا ابني، آني صارلي أربعين سنة بهالشارع. شفت ناس تنتظر، وناس تمشي.');
    await say('salem', 'الشغل ما يجيك، إنت تصنعه.');
    await say('salem', 'الشركات تريد خبرة؟ اصنع خبرتك: اقرا، جرّب، سوّي مشاريع صغيرة للناس. الكتاب اللي ما ينقرا ورق، والشهادة اللي ما تشتغل ورق.');
    addRel('salem', 15); addHope(5, 'كلام أستاذ سالم'); logDay('تعرّف على أستاذ سالم بشارع المتنبي');
    return;
  }
  const greet = S.rel.salem >= 50 ? 'أهلاً بابني الموصلي! تعال اگعد، الچاي جاهز.' : 'أهلاً يا ابني. شلون الطريق؟';
  const opts = ['سولف ويا الأستاذ', S.cv.skills < 3 ? 'أشتري كتاب برمجة (10,000)' : { t: 'قريت كل كتب البرمجة عنده', off: true }, 'نصيحة للمقابلات', 'مع السلامة'];
  const c = await ask('salem', greet, opts);
  if (c === 0) { await say('salem', pick(SALEM_WISDOM)); if (once('salemTalk')) { addRel('salem', 8); addHope(3, 'حكمة'); passTime(30); } }
  else if (c === 1) {
    if (S.rel.salem >= 50 && !S.flags.salemGift) { S.flags.salemGift = true; await say('salem', 'هذا الكتاب هدية مني. بس بشرط: تخلّصه، وترجع تحچيلي شنو تعلمت.'); }
    else if (!pay(10000, 'كتاب برمجة')) return;
    S.cv.skills++; if (!S.inv.includes('book')) S.inv.push('book'); passTime(60); addHope(2); addRel('salem', 2); logDay('اشترى كتاب برمجة وقرا منه');
    await say('mustafa', '(ساعة قراية... حسيت راسي صحى.)'); toast('+CV: مهارات برمجة');
  } else if (c === 2) {
    S.flags.salemAdvice = true;
    await say('salem', 'بالمقابلة كون صادق. اللي يدّعي كلشي، يطلع ما يعرف شي. والخجول يضيّع حقه.');
    await say('salem', 'گول اللي تعرفه، واعترف باللي ما تعرفه، وگول شلون راح تتعلمه. المقابلة مو امتحان بس، هي تعارف.');
  } else await say('salem', 'بأمان الله. والكتب هنا تنتظرك.');
};

  else { S.flags.bagFailDay = S.day; await say('ziad', 'شكراً مصطفى. صراحة... بعدك تحتاج شوية تحضير. ارجع بعد كم يوم.'); addHope(-10, 'مقابلة ما نجحت'); logDay('ما نجح بمقابلة شركة الرافدين'); }

TALK.rebwar = async n => {
  meet('rebwar');
  if (!S.flags.metRebwar) {
    S.flags.metRebwar = true;
    await say('rebwar', 'سلام كاكه! سمعتك تحچي ويا الاستقبال. إنت من الموصل؟');

async function fieldJobOffer(city) {

  };
  await say(who, L[city]);
  if (!S.flags.refusedWasta) {
    await say(who, 'بس... وصلنا خبر إنك دفعت فلوس لواحد حتى يعيّنك بدائرة. إحنا نشتغل بنزاهة، وهالشي يخلّينا نتراجع. آسفين.');

    return;
  }
  if (S.hope <= 50) {
    await say('mustafa', '(... ليش ما أحس بالفرحة؟ حاس نفسي مو مستعد. لازم أرجّع ثقتي بنفسي أول.)');

/* ---------- الحلقة الرئيسية ---------- */
function update(dt) {
  if (G.mode !== 'play' || !G.map) return;
  G.doorCool = Math.max(0, G.doorCool - dt);
  if (G.map.outdoor) { updateCars(dt); updateWalkers(dt); }
  if (isBusy()) { G.p.moving = false; G.target = null; return; }
  movePlayer(dt);
  S.time += dt * TIME_RATE; S.energy = Math.max(0, S.energy - dt * TIME_RATE * 0.018);
  if (S.energy <= 0) { G.lowWarn -= dt; if (G.lowWarn <= 0) { toast('مصطفى خلصت طاقته! لازم ياكل أو ينام.'); G.lowWarn = 25; addHope(-1); } }
  if (S.time >= 24 * 60) { runScript(midnight); return; }
  G.target = findTarget();
  G.storyT -= dt; if (G.storyT <= 0) { G.storyT = 0.5; storyTick(); }
  G.hudT = (G.hudT || 0) - dt; if (G.hudT <= 0) { G.hudT = 0.25; updateHUD(); drawMinimap(); }
  G.lastSave += dt; if (G.lastSave > 20) { G.lastSave = 0; save(); }
}
let lastFrame = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - lastFrame) / 1000); lastFrame = now; G.t += dt;
  try { update(dt); render(); } catch (e) { console.error(e); }
  requestAnimationFrame(frame);
}

/* =====================================================================
   ١٢) التحكم: كيبورد + لمس
   ===================================================================== */
addEventListener('keydown', e => {
  AU.init();
  const code = e.code, k = e.key;
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(code)) e.preventDefault();
  if (G.mgKey) { const dig = code.startsWith('Digit') ? code.slice(5) : code.startsWith('Numpad') ? code.slice(6) : null; G.mgKey(dig || (code === 'Space' ? ' ' : code === 'KeyE' ? 'e' : k)); return; }
  if (DLG.active) {
    if (code === 'Space' || code === 'Enter' || code === 'KeyE' || code === 'NumpadEnter') dlgAdvance();
    else if (DLG.choices && /^(Digit|Numpad)[1-4]$/.test(code)) { const i = +code.slice(-1) - 1, bs = $('#dlgChoices').children; if (bs[i] && !bs[i].disabled) pickChoice(i); }
    return;
  }
  if (code === 'Escape') { const top = G.stack[G.stack.length - 1]; if (top && top.closable) top.close(); return; }
  G.keys[code] = true;
  if (G.mode === 'play' && !isBusy()) {
    if (code === 'KeyE' || code === 'Space' || code === 'Enter') interact();
    else if (code === 'KeyM') openMap();
    else if (code === 'KeyP') openPhone();
  }
});
addEventListener('keyup', e => { G.keys[e.code] = false; });
addEventListener('blur', () => { G.keys = {}; });
$('#dlg').addEventListener('click', () => dlgAdvance());
$('#bMap').onclick = () => { AU.init(); openMap(); };
$('#bPhone').onclick = () => { AU.init(); openPhone(); };
$('#bSound').onclick = () => { AU.init(); $('#bSound').textContent = AU.toggle() ? '🔇' : '🔊'; };
(function joystick() {
  const joy = $('#joy'), knob = $('#knob'); let id = null;
  const set = e => { const r = joy.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2; let dx = e.clientX - cx, dy = e.clientY - cy; const d = Math.hypot(dx, dy), mx = 45; if (d > mx) { dx = dx / d * mx; dy = dy / d * mx; } G.joy.x = dx / mx; G.joy.y = dy / mx; knob.style.transform = `translate(${dx}px,${dy}px)`; };
  joy.addEventListener('pointerdown', e => { AU.init(); id = e.pointerId; joy.setPointerCapture(id); set(e); });
  joy.addEventListener('pointermove', e => { if (e.pointerId === id) set(e); });
  const end = e => { if (e.pointerId !== id) return; id = null; G.joy.x = G.joy.y = 0; knob.style.transform = ''; };
  joy.addEventListener('pointerup', end); joy.addEventListener('pointercancel', end);
  $('#btnAct').addEventListener('pointerdown', e => { e.preventDefault(); AU.init(); if (DLG.active) dlgAdvance(); else interact(); });
})();

/* =====================================================================
   ١٣) الشاشة الرئيسية، البداية، الاستمرار
   ===================================================================== */
function drawTitle(t) {
  const c = $('#titleCanvas'), W = c.width = innerWidth, H = c.height = innerHeight, x = c.getContext('2d');
  const g = x.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#2a1a4a'); g.addColorStop(0.45, '#c8603a'); g.addColorStop(0.7, '#f5b36a'); g.addColorStop(1, '#3a2a1a');
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  x.fillStyle = '#ffd98a'; x.beginPath(); x.arc(W * 0.5, H * 0.66, Math.min(W, H) * 0.12, Math.PI, 0); x.fill();
  const base = H * 0.66;
  x.fillStyle = '#2a1810';
  // أفق الموصل: بيوت وقباب ومنارة الحدباء المايلة
  for (let i = 0; i < 26; i++) { const bw = 40 + (i * 37) % 50, bh = 20 + (i * 53) % 60; x.fillRect((i * 83) % (W + 60) - 30, base - bh, bw, bh); }
  const dome = (cx, r) => { x.beginPath(); x.arc(cx, base - 40, r, Math.PI, 0); x.fill(); x.fillRect(cx - r, base - 40, r * 2, 40); };
  dome(W * 0.2, 28); dome(W * 0.72, 34); dome(W * 0.86, 20);
  x.save(); x.translate(W * 0.36, base); x.rotate(0.07); x.fillRect(-9, -150, 18, 150); x.fillRect(-13, -150, 26, 10); x.beginPath(); x.arc(0, -150, 9, Math.PI, 0); x.fill(); x.restore();
  for (let i = 0; i < 6; i++) { const px = (i * 211 + 60) % W; x.fillRect(px - 2, base - 70, 5, 70); for (let a = 0; a < 6; a++) { x.beginPath(); x.ellipse(px + Math.cos(a) * 14, base - 72 + Math.sin(a) * 4, 16, 4, a, 0, 6.283); x.fill(); } }
  x.fillStyle = '#1e3a5a'; x.fillRect(0, base, W, H - base);
  x.fillStyle = 'rgba(255,217,138,.35)'; for (let i = 0; i < 14; i++) x.fillRect(W * 0.5 - 80 + ((i * 37 + t * 20) % 160), base + 8 + i * 9, 30 - i, 2);
  x.fillStyle = '#1a1008'; x.fillRect(0, base + 20, W, 10); for (let i = 0; i < W; i += 60) x.fillRect(i, base + 20, 8, 40);
  const px = ((t * 30) % (W + 80)) - 40; x.save(); x.translate(px, base + 20); x.scale(1.4, 1.4); drawSprite(x, { skin: '#1a1008', hair: '#1a1008', style: 'short', shirt: '#1a1008', pants: '#1a1008' }, 0, 0, 'right', t, true); x.restore();
}
let titleT0 = performance.now();
function titleLoop(now) { if (G.mode !== 'title') return; drawTitle((now - titleT0) / 1000); requestAnimationFrame(titleLoop); }
function howTo() {
  const m = modal({ cls: 'wide', html: `<h2>كيف ألعب؟</h2>
    <p><b>القصة:</b> إنت مصطفى، خريج علوم حاسبات من الموصل، وبجيبك 150 ألف دينار وعندك 30 يوم. دوّر شغل بمجالك، ودبّر أهلك، ولا تخلّي أملك يخلص.</p>
    <div class="row"><span>المشي</span><b>الأسهم أو WASD (أو الجويستك بالموبايل)</b></div>
    <div class="row"><span>التفاعل / الحچي / الدخول</span><b>E أو Space (أو زر "تفاعل")</b></div>
    <div class="row"><span>خريطة العراق والسفر</span><b>M</b></div>
    <div class="row"><span>الموبايل: رسائل، وظائف، أسماء، سيرة، حقيبة</span><b>P</b></div>
    <div class="row"><span>اختيار بالحوار</span><b>1، 2، 3 أو اضغط بالماوس</b></div>
    <p><b>الأمل:</b> ينزل ويا الرفض والخسارة، ويصعد ويا النجاح والحچي ويا الأهل والأصدقاء. إذا وصل صفر... تخسر.</p>
    <p><b>الطاقة:</b> تنزل بالمشي والوقت. كُل (المطعم، المقهى، الفلافل، غدا أمك) أو نام (البيت أو الفندق).</p>
    <p><b>الوقت:</b> الشركات تفتح الصبح وتسد الساعة 3 العصر. بالليل الدنيا تظلم. الساعة 12 اليوم يخلص غصباً.</p>
    <p><b>الشغل المؤقت:</b> الورشة، النادل، التوزيع، التحميل — كل واحد لعبة صغيرة، تنطي فلوس وخبرة للـCV.</p>
    <p><b>المقابلات:</b> 5 أسئلة وكل سؤال إله 3 أجوبة (صادق، متكبر، خجول). الصدق + CV قوي = نجاح.</p>
    <p><b>العلاقات:</b> حيدر، أبو أحمد، أم علي، ريبوار، أستاذ سالم، مهندس كاظم — كل واحد يتذكرك، وقراراتك تفتح وتسد فرص ونهايات. عدنا 5 نهايات!</p>
    <p class="muted">اللعبة تنحفظ تلقائياً. اضغط "كمّل" من الشاشة الرئيسية حتى ترجع.</p>
    <div class="btns"><button class="btn">فهمت!</button></div>` });
  m.q('.btn').onclick = () => m.close();
}
function enterGame() {
  $('#title').classList.add('hidden');
  ['#hud', '#goal', '#minimapWrap', '#hudBtns'].forEach(s => $(s).classList.remove('hidden'));
  if (isTouch) $('#touch').classList.remove('hidden');
  G.mode = 'play'; updateHUD();
}
async function startNew() {
  AU.init(); clearSave(); S = newState(); enterGame();
  loadMap('home', 3 * TS + 16, 3 * TS + 24); G.p.dir = 'down';
  await runScript(intro);
}
function continueGame() {
  const s = loadSave(); if (!s) return;
  AU.init(); S = Object.assign(newState(), s); enterGame();
  loadMap(S.map, S.px, S.py); G.p.dir = S.dir || 'down';
  toast('أهلاً برجعتك! اليوم ' + S.day + ' — ' + fmtT(S.time));
}
async function intro() {
  G.modals++;
  await fadeOut('<div class="chapter">الفصل ١: الموصل<small>اليوم الأول — الصبح</small></div>'); await wait(1800); await fadeIn();
  G.modals--;
  await say('mom', 'ابني قوم، اليوم يمكن يكون يومك.');
  await say('mustafa', '(صباح الخير يا دنيا... يوم جديد، ونفس السؤال: وين أروح اليوم؟)');
  await narrate('مصطفى، 25 سنة. خريج علوم حاسبات بمعدل جيد جداً من سنتين... وبعده بلا شغل.');
  await narrate('أبوه جان نجار، وورشته انسدت من سنين. ومن وقتها، مصطفى صار "رجل البيت".');
  await narrate('على الميز، ورقة صفرة بخط أبوه...');
  await showNote();
  await say('mustafa', '(بجيبي 150 ألف... آخر فلوس من بيع عدة النجارة مال أبوي. لازم أصرفها صح.)');
  toast('ورقة أبوك انضافت للحقيبة (P ← الحقيبة)', 3500);
  await say('mom', 'يلا يمه، روح سلّم على الحجية أم علي، بيتها بالصوب الثاني من الشارع. هيّي تعرف كل أخبار الحي. وديربالك على نفسك.');
  await say('nour', 'مصطفى! مصطفى! اليوم تلگى شغل؟ إذا لگيت، تشتريلي دفتر رسم؟');
  await say('mustafa', 'إن شاء الله يا نور... إن شاء الله.');
  S.flags.introDone = true; S.today.nourAsk = true;
  toast(isTouch ? 'حرّك الجويستك للمشي، وزر "تفاعل" للحچي والدخول' : 'امشي بالأسهم أو WASD • E للتفاعل • M الخريطة • P الموبايل', 6000);
  save();
}

/* ---------- التشغيل ---------- */
buildWorld(); resize();
$('#tStart').onclick = () => {
  if (loadSave()) { choiceModal('لعبة جديدة؟', '<p>عندك لعبة محفوظة. إذا تبدي من جديد، راح تنمسح.</p>', [{ t: 'ابدأ من جديد' }, { t: 'لا، رجوع', sec: true }], true).then(i => { if (i === 0) startNew(); }); }
  else startNew();
};
$('#tCont').onclick = () => continueGame();
$('#tHow').onclick = () => howTo();
if (!loadSave()) { $('#tCont').disabled = true; $('#tCont').style.opacity = 0.45; }
requestAnimationFrame(titleLoop);
requestAnimationFrame(frame);
