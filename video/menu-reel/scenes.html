<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<!-- ريل «منيوك بعده ورق؟»: قبل وبعد. الصور في img/ مولّدة بـ Figma AI (img/README.md). -->
<style>
@font-face { font-family: M; src: url(fonts/el-messiri-arabic-wght-normal.woff2) format("woff2"); font-weight: 400 700; }
@font-face { font-family: M; src: url(fonts/el-messiri-latin-wght-normal.woff2) format("woff2"); font-weight: 400 700; unicode-range: U+0000-00FF, U+2010-2027; }
@font-face { font-family: P; src: url(fonts/ibm-plex-sans-arabic-arabic-600-normal.woff2) format("woff2"); font-weight: 600; }
@font-face { font-family: P; src: url(fonts/ibm-plex-sans-arabic-latin-600-normal.woff2) format("woff2"); font-weight: 600; unicode-range: U+0000-00FF, U+2010-2027, U+2726, U+2713, U+2715; }
:root { --wine: #3a1220; --gold: #d8b266; --gold2: #f6e3b0; --ink: #f4e9d6; --muted: #d3c0a6; --red: #ff5a5f; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1920px; overflow: clip; background: #12040a; color: var(--ink); }
#bgclip, #stage, .scene, .bgw { position: absolute; inset: 0; overflow: clip; }
#bg { position: absolute; inset: 0; background: radial-gradient(1100px 1100px at 50% 45%, #5a1a2b 0%, #2a0b13 48%, #12040a 100%); }
.scene { display: none; }
.bgw img { position: absolute; left: 0; top: -8px; width: 1080px; height: 1935px; object-fit: cover; }
.shade { position: absolute; inset: 0; }
.shade.top { background: linear-gradient(180deg, rgba(18,4,10,.9) 0%, rgba(18,4,10,.65) 24%, rgba(18,4,10,.1) 48%, rgba(18,4,10,.1) 70%, rgba(18,4,10,.75) 100%); }
.shade.dark { background: radial-gradient(700px 900px at 50% 52%, rgba(18,4,10,.78), rgba(18,4,10,.55) 60%, rgba(18,4,10,.85)); }
.shade.cold { background: linear-gradient(180deg, rgba(8,10,14,.88) 0%, rgba(8,10,14,.55) 30%, rgba(8,10,14,.2) 55%, rgba(8,10,14,.7) 100%); }
.cold img { filter: grayscale(.75) contrast(1.15) brightness(.85); }
.abs { position: absolute; }
.t { position: absolute; left: 70px; right: 70px; text-align: center; font-family: M; font-weight: 700; color: var(--ink); text-shadow: 0 6px 30px rgba(0,0,0,.6); }
.w { display: inline-block; }
.gold { background: linear-gradient(100deg, #a8803a 0%, #f6e3b0 35%, #d8b266 52%, #fff4d6 var(--sh, 60%), #b98f45 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent; }
.red { color: var(--red); }
.sub { font-family: P; font-weight: 600; color: var(--muted); }
.strike { position: relative; display: inline-block; }
.strike::after { content: ""; position: absolute; left: -4%; right: -4%; top: 55%; height: 12px; border-radius: 6px; background: var(--red); transform-origin: 100% 50%; transform: scaleX(var(--s, 0)); box-shadow: 0 0 20px rgba(255,90,95,.6); }
.arch { position: absolute; border: 4px solid var(--gold); border-radius: 999px 999px 0 0; box-shadow: 0 0 120px rgba(216,178,102,.22), inset 0 0 80px rgba(216,178,102,.07); }
.pill { display: inline-block; font: 600 40px P; color: var(--gold); border: 2px solid rgba(216,178,102,.6); border-radius: 60px; padding: 8px 34px; background: rgba(18,4,10,.45); }
.btn { display: inline-block; background: linear-gradient(100deg, #b98f45, #f6e3b0 50%, #d8b266); color: #2a0b13; font: 700 56px M; padding: 26px 70px; border-radius: 80px; box-shadow: 0 20px 60px rgba(216,178,102,.3); }
.cmp { position: absolute; left: 60px; right: 60px; display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
.cell { border-radius: 28px; padding: 28px 24px; font: 600 46px/1.35 P; display: flex; align-items: center; gap: 18px; min-height: 200px; }
.cell .ic { flex: none; width: 66px; height: 66px; border-radius: 50%; display: grid; place-items: center; font: 700 34px P; }
.cell.no { background: rgba(255,255,255,.06); border: 2px solid rgba(255,90,95,.35); color: #e9dcdc; }
.cell.no .ic { background: rgba(255,90,95,.18); color: var(--red); }
.cell.yes { background: rgba(216,178,102,.12); border: 2px solid rgba(216,178,102,.6); color: var(--ink); }
.cell.yes .ic { background: linear-gradient(140deg,#b98f45,#f6e3b0,#d8b266); color: #2a0b13; }
.head { font: 700 66px M; text-align: center; padding: 6px 0; }
#vig { position: absolute; inset: 0; background: radial-gradient(circle at 50% 46%, transparent 52%, rgba(0,0,0,.6) 100%); pointer-events: none; }
#flash { position: absolute; inset: 0; background: radial-gradient(circle at 50% 45%, rgba(246,227,176,.85), rgba(216,178,102,.25) 45%, transparent 75%); opacity: 0; }
#fade { position: absolute; inset: 0; background: #000; opacity: 0; }
</style>
</head>
<body>
<div id="bgclip"><div id="bg"></div></div>
<div id="stage"></div>
<div id="vig"></div><div id="flash"></div><div id="fade"></div>
<script>
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, x) => a + (b - a) * x;
const oc = x => 1 - Math.pow(1 - clamp(x), 3);
const io = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const ob = x => { x = clamp(x); const c = 1.6; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const k = (T, a, d = .5, f = oc) => f((T - a) / d);
const $ = (r, s) => r.querySelector(s), $$ = (r, s) => [...r.querySelectorAll(s)];
function show(e, o, x = 0, y = 0, s = 1, extra = '') { e.style.opacity = o; e.style.transform = `translate(${x}px,${y}px) scale(${s}) ${extra}`; }
function words(txt, cls = '') { return txt.split(' ').map(w => `<span class="w ${cls}">${w}</span>`).join(' '); }
function rise(list, T, at, gap = .08, d = .45) {
  list.forEach((w, i) => { const p = k(T, at + i * gap, d, ob); show(w, clamp(p * 1.5), 0, (1 - p) * 50, lerp(.9, 1, clamp(p))); w.style.filter = p < .9 ? `blur(${(1 - clamp(p)) * 10}px)` : 'none'; });
}
function fadeOut(e, T, at, d = .2) { const p = k(T, at, d, x => clamp(x)); e.style.opacity = Math.min(+e.style.opacity || 1, 1 - p); }
function shine(e, T, at, d = .9) { e.style.setProperty('--sh', `${lerp(-20, 130, clamp((T - at) / d))}%`); }
function photo(name, id, shade = 'top') { return `<div class="bgw ${shade === 'cold' ? 'cold' : ''}" id="${id}"><img src="img/${name}.jpg"><div class="shade ${shade}"></div></div>`; }
function kb(el, T, a, d, z0, z1, y0 = 0, y1 = 0, origin = '50% 50%') { const p = io((T - a) / d), im = $(el, 'img'); im.style.transformOrigin = origin; im.style.transform = `translateY(${lerp(y0, y1, p)}px) scale(${lerp(z0, z1, p)})`; }
// اهتزاز خفيف للمشاهد «قبل» (ثابت من إطار لإطار، مو عشوائي)
const shake = (T, amt) => [Math.sin(T * 37.1) * amt + Math.sin(T * 61.7) * amt * .5, Math.cos(T * 43.3) * amt];

const stage = document.getElementById('stage');
const S = [];
function scene(a, b, tin, html, update) {
  const el = document.createElement('div'); el.className = 'scene'; el.innerHTML = html; stage.appendChild(el);
  S.push({ a, b, tin, el, update });
}

// ===== قبل =====
// 1. الهوك: منيوك بعده ورق؟
scene(0, 2.4, 'cut', `
  ${photo('paper-menu', 'p1', 'cold')}
  <div class="t" id="h1" style="top:300px;font-size:150px;line-height:1.2">${words('منيوك بعده')}<br><span class="w strike red" id="s1">ورق؟</span></div>
`, (T, r) => {
  kb($(r, '#p1'), T, 0, 2.6, 1.22, 1.06, 0, 0, '55% 60%');
  rise($$(r, '#h1 .w'), T, .05, .18, .4);
  $(r, '#s1').style.setProperty('--s', k(T, 1.45, .35, io));
});

// 2. كل تعديل بالسعر… طبعة جديدة
scene(2.4, 4.2, 'cut', `
  ${photo('reprint', 'p2', 'cold')}
  <div class="t" id="h2" style="top:260px;font-size:96px;line-height:1.3">${words('تعديل بالسعر؟')}<br><span class="w red">طبعة</span> <span class="w red">جديدة…</span></div>
  <div class="t sub" id="cnt" style="top:560px;font-size:46px;color:#e9dcdc"></div>
`, (T, r) => {
  kb($(r, '#p2'), T, 2.4, 2.0, 1.0, 1.1, 0, 0, '35% 45%');
  rise($$(r, '#h2 .w'), T, 2.42, .12, .35);
  const n = Math.min(4, Math.max(1, Math.floor((T - 2.9) / .3) + 1));
  $(r, '#cnt').textContent = T > 2.9 ? 'طبعة رقم ' + '١٢٣٤'[n - 1] : '';
});

// 3. ويتوسّخ… ويتمزّق
scene(4.2, 6.0, 'cut', `
  ${photo('paper-menu', 'p3', 'cold')}
  <div class="t" id="h3" style="top:300px;font-size:120px;line-height:1.3">${words('ويتوسّخ…')}<br>${words('ويتمزّق')}</div>
`, (T, r) => {
  kb($(r, '#p3'), T, 4.2, 1.8, 1.5, 1.85, 0, 40, '30% 45%');
  rise($$(r, '#h3 .w'), T, 4.22, .45, .35);
  // التوتر يزيد قبل التحويل
  const [sx, sy] = shake(T, 4 + 14 * k(T, 5.0, 1.0, x => clamp(x)));
  $(r, '#p3').style.transform = `translate(${sx}px,${sy}px)`;
  $(r, '#p3').style.filter = `blur(${k(T, 5.4, .6, x => clamp(x)) * 6}px)`;
});

// ===== بعد =====
// 4. التحويل: خلّيه رقمي
scene(6.0, 7.8, 'flash', `
  ${photo('dining-room', 'p4', 'dark')}
  <div class="arch" id="a4" style="left:200px;top:520px;width:680px;height:900px"></div>
  <div class="t" id="h4" style="top:720px;font-size:160px;line-height:1.25">${words('خلّيه')}<br><span class="w gold" id="g4">رقمي</span></div>
  <div class="t" id="st4" style="top:1150px;font:600 70px P;color:var(--gold)">✦</div>
`, (T, r) => {
  kb($(r, '#p4'), T, 6.0, 2.0, 1.15, 1.02, 0, 0, '50% 60%');
  $(r, '#a4').style.clipPath = `inset(${(1 - k(T, 6.0, .7, io)) * 100}% 0 0 0)`;
  rise($$(r, '#h4 .w'), T, 6.05, .22, .45); shine($(r, '#g4'), T, 6.5, .8);
  const st = k(T, 6.6, .5, ob); show($(r, '#st4'), clamp(st * 1.5), 0, 0, lerp(.3, 1, clamp(st)), `rotate(${lerp(-90, 0, clamp(st))}deg)`);
});

// 5. يمسح الرمز… ويفتح المنيو بموبايله
scene(7.8, 10.2, 'whip', `
  ${photo('qr-table', 'p5', 'top')}
  <div class="t" id="h5a" style="top:250px;font-size:100px">${words('يمسح')} <span class="w gold">الرمز…</span></div>
  <div class="t" id="h5b" style="top:250px;font-size:90px;line-height:1.3">${words('ويفتح المنيو')}<br><span class="w gold" id="g5">بموبايله</span></div>
`, (T, r) => {
  kb($(r, '#p5'), T, 7.8, 2.6, 1.0, 1.16, 0, 0, '62% 45%');
  rise($$(r, '#h5a .w'), T, 7.82, .14); fadeOut($(r, '#h5a'), T, 8.9);
  rise($$(r, '#h5b .w'), T, 9.0, .12); shine($(r, '#g5'), T, 9.4);
});

// 6. بلا تطبيق ولا تسجيل
scene(10.2, 12.0, 'whip', `
  ${photo('happy-guest', 'p6', 'top')}
  <div class="t" id="h6" style="top:250px;font-size:100px;line-height:1.3">${words('بلا تطبيق')}<br><span class="w gold">ولا</span> <span class="w gold">تسجيل</span></div>
  <div class="t" id="c6" style="top:1560px"><span class="pill">أي موبايل · آيفون أو أندرويد</span></div>
`, (T, r) => {
  kb($(r, '#p6'), T, 10.2, 2.0, 1.12, 1.0, 0, 0, '50% 45%');
  rise($$(r, '#h6 .w'), T, 10.22, .16);
  const c = k(T, 10.9, .45, ob); show($(r, '#c6'), clamp(c * 1.5), 0, (1 - c) * 40);
});

// 7. بألوان مطعمك وشعاره
scene(12.0, 13.8, 'whip', `
  ${photo('brand-kit', 'p7', 'top')}
  <div class="t" id="h7" style="top:250px;font-size:100px;line-height:1.3">${words('بألوان')} <span class="w gold">مطعمك</span><br>${words('وشعاره')}</div>
`, (T, r) => {
  kb($(r, '#p7'), T, 12.0, 2.0, 1.16, 1.02, 0, -40, '50% 40%');
  rise($$(r, '#h7 .w'), T, 12.02, .16);
});

// 8. تعديل الأسعار… بلا طباعة
scene(13.8, 15.6, 'whip', `
  ${photo('owner-phone', 'p8', 'top')}
  <div class="t" id="h8" style="top:250px;font-size:96px;line-height:1.3">${words('تعديل الأسعار؟')}<br><span class="w gold" id="g8">بلا طباعة</span></div>
`, (T, r) => {
  kb($(r, '#p8'), T, 13.8, 2.0, 1.0, 1.12, 0, 0, '58% 58%');
  rise($$(r, '#h8 .w'), T, 13.82, .16); shine($(r, '#g8'), T, 14.5);
});

// 9. المقارنة: الورقي × الرقمي (كل سطر على ضربة)
const ROWS = [['طباعة مع كل تعديل', 'تعديل بلا طباعة'], ['يتوسّخ ويتمزّق', 'نظيف وجديد دائماً'], ['تنتظر النادل يجيبه', 'يفتح من رمز QR']];
scene(15.6, 19.2, 'up', `
  <div class="t" id="h9" style="top:250px;font-size:84px">${words('الفرق')} <span class="w gold">واضح</span></div>
  <div class="cmp" style="top:440px">
    <div class="head red" id="hn">الورقي</div><div class="head gold" id="hy">الرقمي</div>
  </div>
  ${ROWS.map(([a, b], i) => `<div class="cmp row" style="top:${600 + i * 250}px">
    <div class="cell no"><span class="ic">✕</span><span>${a}</span></div>
    <div class="cell yes"><span class="ic">✓</span><span>${b}</span></div></div>`).join('')}
`, (T, r) => {
  rise($$(r, '#h9 .w'), T, 15.62, .14);
  show($(r, '#hn'), k(T, 15.9, .3), 0, 0); show($(r, '#hy'), k(T, 15.9, .3), 0, 0);
  $$(r, '.row').forEach((row, i) => {
    const at = 16.2 + i * .6, [no, yes] = $$(row, '.cell');
    const a = k(T, at, .35, ob), b = k(T, at + .3, .35, ob);
    show(no, clamp(a * 1.5), (1 - a) * 120, 0, lerp(.9, 1, clamp(a)));
    show(yes, clamp(b * 1.5), (1 - b) * -120, 0, lerp(.9, 1, clamp(b)));
  });
});

// 10. الخاتمة: منيو رقمي لمطعمك + واتساب
scene(19.2, 99, 'flash', `
  <div class="arch" id="a10" style="left:170px;top:300px;width:740px;height:1300px;border-width:3px;opacity:.6"></div>
  <div class="t" id="h10" style="top:400px;font-size:92px;line-height:1.3">${words('منيو رقمي')}<br><span class="w gold" id="g10">لمطعمك</span></div>
  <div class="t" id="cta" style="top:700px"><span class="btn">راسلني على واتساب</span></div>
  <div class="t" id="num" style="top:880px;font:700 92px P;direction:ltr;color:var(--gold2)">0774 780 0611</div>
  <div class="abs" id="qrw" style="left:415px;top:1040px;width:250px;height:250px;padding:26px;border-radius:28px;background:#f6ecd8;box-shadow:0 20px 60px rgba(0,0,0,.5)">
    <img src="img/qr-wa.svg" style="width:100%;height:100%;display:block"></div>
  <div class="t" id="brand" style="top:1340px;font-size:70px"><span class="gold" id="bg10">واجهة</span> <span style="font:600 46px P;color:var(--gold)">✦</span> <span style="font:700 56px M;direction:ltr;display:inline-block">Wajha Studio</span></div>
  <div class="t sub" id="who" style="top:1450px;font-size:38px">عبدالله حمزه علي · الموصل</div>
`, (T, r) => {
  $(r, '#a10').style.clipPath = `inset(${(1 - k(T, 19.2, .9, io)) * 100}% 0 0 0)`;
  rise($$(r, '#h10 .w'), T, 19.22, .16); shine($(r, '#g10'), T, 19.7);
  const c = k(T, 19.8, .45, ob); show($(r, '#cta'), clamp(c * 1.5), 0, (1 - c) * 50, lerp(.85, 1, clamp(c)));
  const pulse = T > 20.6 ? 1 + Math.max(0, Math.sin((T - 20.6) * 5.236)) * .03 : 1; $(r, '#cta').firstElementChild.style.transform = `scale(${pulse})`;
  const n = k(T, 20.4, .45, ob); show($(r, '#num'), clamp(n * 1.5), 0, (1 - n) * 30);
  const q = k(T, 21.0, .5, ob); show($(r, '#qrw'), clamp(q * 1.5), 0, (1 - q) * 40, lerp(.85, 1, clamp(q)));
  const b = k(T, 21.6, .5, ob); show($(r, '#brand'), clamp(b * 1.5), 0, (1 - b) * 30); shine($(r, '#bg10'), T, 22.0, 1.0);
  show($(r, '#who'), k(T, 22.0, .5), 0, 0);
});

// ===== الانتقالات =====
const DIN = .3;
function tin(type, x) {
  const e = oc(x);
  if (type === 'whip') return { o: 1, s: 1, x: (1 - e) * -1080, y: 0, b: (1 - e) * 26 };
  if (type === 'up') return { o: 1, s: 1, x: 0, y: (1 - e) * 1920, b: (1 - e) * 26 };
  if (type === 'flash') return { o: clamp(x * 3), s: lerp(1.1, 1, e), x: 0, y: 0, b: (1 - e) * 8 };
  return { o: 1, s: 1, x: 0, y: 0, b: 0 };
}
window.setT = T => {
  for (let i = 0; i < S.length; i++) {
    const sc = S[i], next = S[i + 1];
    const outing = next && next.tin === 'whip' && T >= next.a - .18 && T < next.a;
    const vis = (T >= sc.a && T < sc.b) || outing;
    sc.el.style.display = vis ? 'block' : 'none'; if (!vis) continue;
    sc.update(T, sc.el);
    let r = { o: 1, s: 1, x: 0, y: 0, b: 0 };
    const lt = T - sc.a;
    if (lt < DIN && i && sc.tin !== 'cut') r = tin(sc.tin, lt / DIN);
    if (outing) { const x = (T - (next.a - .18)) / .18; r = { o: 1, s: 1, x: x * x * 1080, y: 0, b: x * 26 }; }
    if (next && next.tin === 'up' && T >= next.a - .18 && T < next.a) { const x = (T - (next.a - .18)) / .18; r = { o: 1, s: 1, x: 0, y: -x * x * 1920, b: x * 26 }; }
    sc.el.style.opacity = r.o; sc.el.style.filter = r.b > .3 ? `blur(${r.b}px)` : 'none';
    sc.el.style.transform = `translate(${r.x}px,${r.y}px) scale(${r.s})`;
  }
  // وميض ذهبي عند التحويل (6.0) والخاتمة (19.2)
  let f = 0; for (const a of [6.0, 19.2]) f = Math.max(f, 1 - Math.abs(T - a) / (a === 6.0 ? .45 : .3));
  document.getElementById('flash').style.opacity = clamp(f);
  document.getElementById('bg').style.transform = `scale(1.25) translate(${Math.sin(T / 5) * 40}px, ${Math.cos(T / 6) * 30}px)`;
  document.getElementById('fade').style.opacity = clamp((T - (window.DUR - .5)) / .5);
};
window.DUR = 25.2;
setT(0);
</script>
</body>
</html>
